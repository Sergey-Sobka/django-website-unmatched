{% extends 'base.html' %}

{% block title %}
Edit
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body">
                <h1 class="h3 mb-4">
                    Edit information
                </h1>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ field.id_for_label }}">
                                {{ field.label }}
                            </label>

                            {{ field }}

                            {% if field.errors %}
                                <div class="text-danger small mt-1">
                                    {{ field.errors }}
                                </div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-dark">
                        Save
                    </button>

                    <a href="javascript:history.back()" class="btn btn-outline-dark">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
