{% extends 'base.html' %}

{% block title %}
Edit profile
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Edit profile
</h1>

<form method="post" enctype="multipart/form-data" class="col-md-6">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-dark">
        Save
    </button>

    <a href="{% url 'users:profile' %}" class="btn btn-outline-dark">
        Cancel
    </a>
</form>

{% endblock %}
