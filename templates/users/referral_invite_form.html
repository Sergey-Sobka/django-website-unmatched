{% extends 'base.html' %}

{% block title %}
Create invite
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Create invite
</h1>

<form method="post" class="col-md-5">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-dark">
        Send invite
    </button>

    <a href="{% url 'users:referral-invite-list' %}" class="btn btn-outline-dark">
        Cancel
    </a>
</form>

{% endblock %}
