{% extends 'base.html' %}

{% block title %}
Logout
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Logout
</h1>

<p>
    Are you sure you want to logout?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-dark">
        Logout
    </button>
</form>

{% endblock %}
