{% extends 'base.html' %}

{% block title %}
Sign up
{% endblock %}

{% block content %}

<div class="auth-panel">
    <h1 class="mb-4">
        Sign up
    </h1>

    <p class="text-muted">
        Create account to track matches and use referral editor access.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if redirect_field_value %}
            <input
                type="hidden"
                name="{{ redirect_field_name }}"
                value="{{ redirect_field_value }}"
            >
        {% endif %}

        <button type="submit" class="btn btn-dark w-100">
            Create account
        </button>
    </form>

    <p class="mt-3 mb-0">
        Already have account?
        <a href="{% url 'account_login' %}">
            Login
        </a>
    </p>
</div>

{% endblock %}
