{% extends 'base.html' %}

{% block title %}
Password reset
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Password reset
</h1>

<p>
    Enter your email and Django will print reset email in the console.
</p>

<form method="post" class="col-md-5">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-dark">
        Send reset email
    </button>
</form>

{% endblock %}
