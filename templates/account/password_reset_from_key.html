{% extends 'base.html' %}

{% block title %}
Set new password
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Set new password
</h1>

{% if token_fail %}
    <p>
        This password reset link is invalid.
    </p>
{% else %}
    <form method="post" class="col-md-5">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-dark">
            Save password
        </button>
    </form>
{% endif %}

{% endblock %}
