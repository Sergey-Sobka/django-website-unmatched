{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth-panel">
    <h1 class="mb-4">
        Login
    </h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        {% if redirect_field_value %}
            <input
                type="hidden"
                name="{{ redirect_field_name }}"
                value="{{ redirect_field_value }}"
            >
        {% endif %}

        <button type="submit" class="btn btn-dark w-100">
            Login
        </button>
    </form>

    <p class="mt-3">
        No account?
        <a href="{% url 'account_signup' %}">
            Sign up
        </a>
    </p>

    <p class="mb-0">
        <a href="{% url 'account_reset_password' %}">
            Forgot password?
        </a>
    </p>
</div>

{% endblock %}
