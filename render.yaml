databases:
  - name: unmatched-wiki-db
    plan: free
    databaseName: unmatched_wiki
    user: unmatched_wiki

services:
  - type: web
    name: unmatched-wiki
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unmatched-wiki-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "4"
